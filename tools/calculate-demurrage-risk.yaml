annotations:
  cost: none
  read_only: true
  requires_confirmation: false
description: Calculate daily escalating demurrage and detention charges for delayed
  containers.
input_schema:
  additionalProperties: false
  properties:
    container_count:
      type: number
    daily_rate_structure:
      type: string
    free_days_remaining:
      type: number
  required:
  - container_count
  - free_days_remaining
  type: object
name: calculate-demurrage-risk
output_schema:
  additionalProperties: false
  properties:
    confidence:
      type: number
    data:
      type: string
    status:
      type: string
  required:
  - status
  - data
  type: object
